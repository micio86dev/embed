name: CI — embed

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]

jobs:
  ci:
    name: Typecheck, lint, test, build & bundle-size gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Same Bun minor the sibling repos' CI uses (frontend/backoffice ci.yml).
      - name: Install Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      # SPEC §4.3: the IIFE bundle must stay <= 12KB gzipped.
      - name: Bundle-size gate
        run: node scripts/check-bundle-size.mjs
